[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "bubble-theory"
version = "0.1.0"
description = "Minimal dynamical universe and coherent domain detector"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
bubble-theory = "bubble_theory.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
